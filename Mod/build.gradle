buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1+'
        classpath 'com.github.jengelman.gradle.plugins:shadow:4.0.2'
    }
}

apply plugin: 'forge'
apply plugin: 'com.github.johnrengelman.shadow'

version = ""
group = "fr.welloznetwork.wellozmod"
archivesBaseName = "WelloZMod"

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

dependencies {
    compile files('libs/mixin-0.8-SNAPSHOT.jar')
    compile files('libs/Venus.jar')
    
    shadow 'net.java.dev.jna:jna:5.12.1'
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ["-AreobfSrgFile=${project.file('conf/joined.srg')}", "-AoutRefMapFile=${project.file('build/resources/main/mixins.wellozmod.refmap.json')}"]
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    enabled = false
    dependsOn shadowJar

    from {
        configurations.compile.findAll {
            it.name.endsWith(".jar")
        }.collect {
            zipTree(it)
        }
    }
    manifest {
        attributes('FMLCorePlugin': 'fr.welloznetwork.wellozmod.mixins.Mixin', 'FMLCorePluginContainsFMLMod': 'true', 'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker', 'MixinConfigs': 'mixins.wellozmod.json', 'ForceLoadAsMod': 'true')
    }
}

shadowJar {
    classifier = ''
    configurations = [project.configurations.shadow]
}

def mixinConfig = 'mixins.wellozmod.json'
def refMapConfig = 'mixins.wellozmod.refmap.json'
def relativePathToMixinAP = 'libs/mixin-0.8-SNAPSHOT.jar'

repositories {
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven/"
    }
}

dependencies {
    shadow('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude module: 'log4j-core'
    }
}

def mixinSrg = file("$buildDir/tmp/reobf/mixins.srg")
def refMap = file("$buildDir/tmp/compileJava/mixins.wellozmod.refmap.json")

shadowJar {
    from refMap
    manifest {
        attributes.put("TweakClass", "org.spongepowered.asm.launch.MixinTweaker")
        attributes.put("FMLCorePluginContainsFMLMod", true)
        attributes.put("ForceLoadAsMod", true)
        attributes.put("MixinConfigs", mixinConfig)
    }
}

reobf {
    addExtraSrgFile mixinSrg
}

def mixinAPJar = file("libs/mixin-0.8-SNAPSHOT.jar")
def srgFile = file("${gradle.gradleUserHomeDir}/caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/srgs/mcp-srg.srg")

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = files(mixinAPJar)
    options.compilerArgs += ["-processor", "org.spongepowered.tools.obfuscation.MixinObfuscationProcessorInjection,org.spongepowered.tools.obfuscation.MixinObfuscationProcessorTargets", "-AreobfSrgFile=${srgFile}", "-AoutSrgFile=${mixinSrg}", "-AoutRefMapFile=${refMap}", "-Xlint:-sunapi", "-XDenableSunApiLintControl", "-XDignore.symbol.file"]
}

sourceSets {
    main {
        ext.refMap = refMapConfig
    }
}
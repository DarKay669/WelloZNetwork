# Configuration file

modules {
    # Enable/Disable Blur [default: false]
    B:blur=false

    # Switch between the NORMAL, ADAPTIVE and CLEAR chat mode [default: NORMAL]
    S:chatMode=NORMAL
    S:chatmode=NORMAL

    # Enable/Disable CPS [default: false]
    B:cps=false

    # Change the CPS text color [0 = BLACK, 1 = DARK BLUE, 2 = DARK GREEN, 3 = DARK AQUA, 4 = DARK RED, 5 = DARK PURPLE, 6 = GOLD, 7 = GRAY, 8 = DARK GRAY, 9 = BLUE, 10 = GREEN, 11 = AQUA, 12 = RED, 13 = LIGHT PURPLE, 14 = YELLOW, 15 = WHITE, 16 = RAINBOW, 17 = HUE RAINBOW] [range: 0 ~ 17, default: 15]
    I:cpsColor=15

    # Change the horizontal CPS position [range: 0 ~ 0, default: 2]
    I:cpsPosX=2

    # Change the vertical CPS position [range: 0 ~ 0, default: 80]
    I:cpsPosY=80

    # Enable/Disable Keystrokes [default: false]
    B:keystrokes=false

    # Change the Keystrokes keys color [0 = BLACK, 1 = DARK BLUE, 2 = DARK GREEN, 3 = DARK AQUA, 4 = DARK RED, 5 = DARK PURPLE, 6 = GOLD, 7 = GRAY, 8 = DARK GRAY, 9 = BLUE, 10 = GREEN, 11 = AQUA, 12 = RED, 13 = LIGHT PURPLE, 14 = YELLOW, 15 = WHITE, 16 = RAINBOW, 17 = HUE RAINBOW] [range: 0 ~ 17, default: 15]
    I:keystrokesColor=15

    # Change the Keystrokes color when a key is pressed [0 = BLACK, 1 = DARK BLUE, 2 = DARK GREEN, 3 = DARK AQUA, 4 = DARK RED, 5 = DARK PURPLE, 6 = GOLD, 7 = GRAY, 8 = DARK GRAY, 9 = BLUE, 10 = GREEN, 11 = AQUA, 12 = RED, 13 = LIGHT PURPLE, 14 = YELLOW, 15 = WHITE, 16 = RAINBOW, 17 = HUE RAINBOW] [range: 0 ~ 17, default: 15]
    I:keystrokesColorPressed=15

    # Change the Keystrokes display [0 = ZQSD, 1 = ZQSD + CPS, 2 = ZQSD + JUMP + CPS, 3 = WASD, 4 = WASD + CPS, 5 = WASD + JUMP + CPS] [range: 0 ~ 5, default: 0]
    I:keystrokesMode=0

    # Change the Keystrokes horizontal position [range: 0 ~ 0, default: 2]
    I:keystrokesPosX=2

    # Change the Keystrokes vertical position [range: 0 ~ 0, default: 40]
    I:keystrokesPosY=40

    # Enable/Disable Reach Display [default: false]
    B:reachDisplay=false

    # Change the Reach Display text color [0 = BLACK, 1 = DARK BLUE, 2 = DARK GREEN, 3 = DARK AQUA, 4 = DARK RED, 5 = DARK PURPLE, 6 = GOLD, 7 = GRAY, 8 = DARK GRAY, 9 = BLUE, 10 = GREEN, 11 = AQUA, 12 = RED, 13 = LIGHT PURPLE, 14 = YELLOW, 15 = WHITE, 16 = RAINBOW, 17 = HUE RAINBOW] [range: 0 ~ 17, default: 15]
    I:reachDisplayColor=15

    # Change the Reach Display horizontal position [range: 0 ~ 0, default: 2]
    I:reachDisplayPosX=2

    # Change the Reach Display vertical position [range: 0 ~ 0, default: 16]
    I:reachDisplayPosY=16

    # Switch between the OLD, NEW and LEGACY button theme [default: OLD]
    S:theme=OLD

    # Change the time type of the world [0 = Vanilla, 1 = Day, 2 = Sunset, 3 = Night, 4 = Fast] [range: 0 ~ 4, default: 0]
    I:timeType=0

    # Enable/Disable Toggle Sprint [default: false]
    B:toggleSprint=false

    # Change the Toggle Sprint text color [0 = BLACK, 1 = DARK BLUE, 2 = DARK GREEN, 3 = DARK AQUA, 4 = DARK RED, 5 = DARK PURPLE, 6 = GOLD, 7 = GRAY, 8 = DARK GRAY, 9 = BLUE, 10 = GREEN, 11 = AQUA, 12 = RED, 13 = LIGHT PURPLE, 14 = YELLOW, 15 = WHITE, 16 = RAINBOW, 17 = HUE RAINBOW] [range: 0 ~ 17, default: 15]
    I:toggleSprintColor=15

    # Change the Toggle Sprint horizontal position [range: 0 ~ 0, default: 2]
    I:toggleSprintPosX=2

    # Change the Toggle Sprint vertical position [range: 0 ~ 0, default: 2]
    I:toggleSprintPosY=2
}


